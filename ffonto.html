<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFOnto - Turtle Source Code</title>
  <!-- Dark theme syntax highlighting stylesheet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #1e1e1e;
      color: #d4d4d4;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; margin: 0; color: #fff; }
    .download-btn {
      background-color: #0e639c;
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    pre {
      border-radius: 6px;
      padding: 20px !important;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>ffonto.ttl</h1>
    <a href="ffonto.ttl" download class="download-btn">Download Raw .ttl</a>
  </header>

  <pre><code class="language-turtle" id="ttl-code">Loading ffonto.ttl...</code></pre>

  <!-- Prism.js Scripts for Turtle Syntax Highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-turtle.min.js"></script>

  <script>
    // Fetch and render the raw ffonto.ttl file dynamically
    fetch('ffonto.ttl')
      .then(response => {
        if (!response.ok) throw new Error('File not found');
        return response.text();
      })
      .then(code => {
        const codeElement = document.getElementById('ttl-code');
        codeElement.textContent = code;
        Prism.highlightElement(codeElement);
      })
      .catch(err => {
        document.getElementById('ttl-code').textContent = 'Error loading ffonto.ttl file.';
      });
  </script>

</body>
</html>
